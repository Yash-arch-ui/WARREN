[package]
name = "warren"
version = "0.1.0"
edition = "2024"
description = "WARREN — a minimal CLI client for a mixnet-routed messenger"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Sphinx mix-packet format (M1) — see docs/LIBRARY_SELECTION.md §1
sphinx-packet = "0.7.0"
# Blind-signature admission tokens (M2) — RFC 9474 / Privacy Pass v1, see
# docs/LIBRARY_SELECTION.md §2
blind-rsa-signatures = "0.17"
x25519-dalek = { version = "3", features = ["getrandom", "static_secrets", "zeroize"] }
# Relay long-term identity signing (M3 directory) — see docs/LIBRARY_SELECTION.md §4
ed25519-dalek = "2.1"
# Layer-3 message-body encryption: the Olm Double Ratchet (M3) — see docs/LIBRARY_SELECTION.md §5
vodozemac = "0.10"
sha2 = "0.11"
rand = "0.10"
# Exponential/Poisson sampling for mix timing (M5) — already in the tree via
# sphinx-packet, which uses rand_distr::Exp for its Delay type; see docs/LIBRARY_SELECTION.md §6
rand_distr = "0.6"
hex = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tiny_http = "0.12.0"

[dev-dependencies]
hex = "0.4"

[profile.release]
lto = true
